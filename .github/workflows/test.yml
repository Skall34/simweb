name: Tests simweb (client SimBridge + protocole + lint PHP)

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Suites C# + loopback UDP + php -l
      run: sh simbridge/tests/run_all_tests.sh
