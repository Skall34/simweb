server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    charset utf-8;

    # Logs
    access_log /var/log/nginx/simweb_access.log;
    error_log  /var/log/nginx/simweb_error.log;

    # ── Sécurité : bloquer les fichiers/dossiers sensibles ──

    # Fichiers de config et dotfiles
    location ~ /\.(env|git|htaccess|installed) {
        deny all;
        return 404;
    }
    location ~* \.(ini|sql|log|bkp|sh)$ {
        deny all;
        return 404;
    }

    # Dossiers PHP internes (jamais accessibles en direct)
    location ^~ /includes/ {
        deny all;
        return 404;
    }
    location ^~ /scripts/ {
        deny all;
        return 404;
    }
    location ^~ /lang/ {
        deny all;
        return 404;
    }
    location ^~ /install/ {
        # Décommenter pour bloquer l'accès en production :
        # deny all;
        # return 404;
        try_files $uri $uri/ /install/index.php?$query_string;
    }

    # ── Assets statiques — servis directement par Nginx ──
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot|zip)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Routing principal ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }
}
