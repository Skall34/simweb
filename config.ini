; Configuration de la Virtual Airline
; Ce fichier contient toutes les constantes utilisées par l'application
; Généré automatiquement par l'installateur

; ==================== BASE DE DONNÉES ====================

[database]
host = localhost
name = test_va_db
user = test_user
password = test_pass
charset = utf8mb4

; ==================== INFORMATIONS COMPAGNIE ====================

[company]
name = Test Virtual Airlines
icao = TVA
iata = TV
tagline = La meilleure VA de test

; ==================== CONTACT ====================

[contact]
contact_email = contact@testva.com
admin_email = admin@testva.com

; ==================== ADMINISTRATION ====================

[admin]
super_admin_callsigns = ADM0001
base_url = https://www.testva.com

; ==================== CONFIGURATION SMTP ====================

[smtp]
host = smtp.gmail.com
port = 587
secure = tls
username = test@gmail.com
password = password123
from_email = noreply@testva.com
from_name = Test VA

; ==================== RÉSEAUX SOCIAUX ====================

[social]
discord_url = https://discord.gg/test
website_url = 
forum_url = 

; ==================== PARAMÈTRES FINANCIERS ====================

[financial]
currency = EUR
currency_symbol = €
currency_position = after
starting_balance = 15000

; ==================== PARAMÈTRES SYSTÈME ====================

[system]
timezone = Europe/Paris
default_language = fr
registration_enabled = true
min_flights_for_promotion = 10

; ==================== PARAMÈTRES SIMADDON ====================

[simaddon]
enabled = true
api_url = https://api.simaddon.com

; ==================== MODE DEBUG ====================

[debug]
debug_mode = false
